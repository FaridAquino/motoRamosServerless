service: ws-motoRamos

provider:
  name: aws
  runtime: python3.12
  timeout: 29
  region: us-east-1
  stage: dev

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:DeleteItem
            - dynamodb:UpdateItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource:
            - "arn:aws:dynamodb:us-east-1:*:table/conexiones"
            - "arn:aws:dynamodb:us-east-1:*:table/conexiones/index/*"
            - "arn:aws:dynamodb:us-east-1:*:table/servicios"
            - "arn:aws:dynamodb:us-east-1:*:table/servicios/index/*"
            - "arn:aws:dynamodb:us-east-1:*:table/conductores"
            - "arn:aws:dynamodb:us-east-1:*:table/conductores/index/*"
            - "arn:aws:dynamodb:us-east-1:*:table/usuarios"
            - "arn:aws:dynamodb:us-east-1:*:table/usuarios/index/*"
        - Effect: Allow
          Action:
            - execute-api:ManageConnections
          Resource:
            - "arn:aws:execute-api:us-east-1:*:*/@connections/*"

  environment:
    conexionesTable: conexiones
    serviciosTable: servicios
    conductoresTable: conductores
    usuariosTable: usuarios
    JWT_SECRET: ${env:JWT_SECRET, 'motoRamos-tarma-jwt-secret-utec-2026'}

package:
  patterns:
    - '!node_modules/**'
    - '!.serverless/**'
    - '!venv/**'
    - '!__pycache__/**'
    - '!package-lock.json'
    - ./**

functions:
  # ── Conexión / Desconexión ──
  Connect:
    handler: handler.connect
    events:
      - websocket:
          route: $connect

  Disconnect:
    handler: handler.disconnect
    events:
      - websocket:
          route: $disconnect

  Default:
    handler: handler.default_handler
    events:
      - websocket:
          route: $default

  # ── Acciones del Pasajero ──
  ServicioRequerido:
    handler: handler.servicio_requerido
    events:
      - websocket:
          route: servicioRequerido

  CancelarServicio:
    handler: handler.cancelar_servicio
    events:
      - websocket:
          route: cancelarServicio

  # ── Acciones del Conductor ──
  AceptarServicio:
    handler: handler.aceptar_servicio
    events:
      - websocket:
          route: aceptarServicio

  IniciarViaje:
    handler: handler.iniciar_viaje
    events:
      - websocket:
          route: iniciarViaje

  CompletarViaje:
    handler: handler.completar_viaje
    events:
      - websocket:
          route: completarViaje

  RegistrarUbicacionMoto:
    handler: handler.registrar_ubicacion_moto
    events:
      - websocket:
          route: registrarUbicacionMoto

  # ── Comunicación ──
  Informar:
    handler: handler.informar
    events:
      - websocket:
          route: informar

  # ── Heartbeat ──
  Ping:
    handler: handler.ping
    events:
      - websocket:
          route: ping
