service: api-usuarios-motoRamos

provider:
  name: aws
  runtime: python3.12
  timeout: 29
  region: us-east-1
  stage: dev

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:DeleteItem
            - dynamodb:UpdateItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource:
            - "arn:aws:dynamodb:us-east-1:*:table/usuarios"
            - "arn:aws:dynamodb:us-east-1:*:table/usuarios/index/*"
            - "arn:aws:dynamodb:us-east-1:*:table/servicios"
            - "arn:aws:dynamodb:us-east-1:*:table/servicios/index/*"
            - "arn:aws:dynamodb:us-east-1:*:table/conductores"
            - "arn:aws:dynamodb:us-east-1:*:table/conductores/index/*"
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
          Resource:
            - "arn:aws:s3:::motoramos-fotos-${self:provider.stage}/*"

  environment:
    usuariosTable: usuarios
    conductoresTable: conductores
    serviciosTable: servicios
    fotosBucket: motoramos-fotos-${self:provider.stage}
    JWT_SECRET: ${env:JWT_SECRET, 'motoRamos-tarma-jwt-secret-utec-2026'}

package:
  patterns:
    - '!node_modules/**'
    - '!.serverless/**'
    - '!venv/**'
    - '!__pycache__/**'
    - '!package-lock.json'
    - ./**

functions:
  # ── Públicos (sin JWT) ──
  RegisterUsuario:
    handler: handler.registerUsuario
    events:
      - http:
          path: /registerUsuario
          method: post
          cors: true

  LoginUsuario:
    handler: handler.loginUsuario
    events:
      - http:
          path: /loginUsuario
          method: post
          cors: true

  # ── Protegidos (requieren JWT) ──
  GetPerfilUsuario:
    handler: handler.getPerfilUsuario
    events:
      - http:
          path: /perfil
          method: get
          cors: true

  UpdatePerfilUsuario:
    handler: handler.updatePerfilUsuario
    events:
      - http:
          path: /perfil
          method: put
          cors: true

  GetPresignedUploadUrl:
    handler: handler.getPresignedUploadUrl
    events:
      - http:
          path: /perfil/foto-url
          method: get
          cors: true

  GetHistorialUsuario:
    handler: handler.getHistorialUsuario
    events:
      - http:
          path: /historial
          method: get
          cors: true

  CalificarConductor:
    handler: handler.calificarConductor
    events:
      - http:
          path: /calificar
          method: post
          cors: true
