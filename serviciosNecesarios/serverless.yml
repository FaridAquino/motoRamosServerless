service: infra-motoRamos

provider:
  name: aws
  region: us-east-1
  stage: dev

resources:
  Resources:
    # ═══════════════════════════════════════════════════════════════════
    # Tabla: usuarios (pasajeros de Tarma)
    # ═══════════════════════════════════════════════════════════════════
    UsuariosTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: usuarios
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
          - AttributeName: correo
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: CorreoIndex
            KeySchema:
              - AttributeName: correo
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    # ═══════════════════════════════════════════════════════════════════
    # Tabla: conductores (mototaxistas de Tarma)
    # ═══════════════════════════════════════════════════════════════════
    ConductoresTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: conductores
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: driverId
            AttributeType: S
          - AttributeName: correo
            AttributeType: S
          - AttributeName: placa
            AttributeType: S
        KeySchema:
          - AttributeName: driverId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: CorreoIndex
            KeySchema:
              - AttributeName: correo
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: PlacaIndex
            KeySchema:
              - AttributeName: placa
                KeyType: HASH
            Projection:
              ProjectionType: KEYS_ONLY

    # ═══════════════════════════════════════════════════════════════════
    # Tabla: servicios (viajes / carreras)
    # ═══════════════════════════════════════════════════════════════════
    ServiciosTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: servicios
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: serviceId
            AttributeType: S
          - AttributeName: usuarioId
            AttributeType: S
          - AttributeName: driverId
            AttributeType: S
          - AttributeName: estado
            AttributeType: S
          - AttributeName: creadoEn
            AttributeType: S
        KeySchema:
          - AttributeName: serviceId
            KeyType: HASH
        GlobalSecondaryIndexes:
          # Historial del pasajero ordenado por fecha
          - IndexName: UsuarioFechaIndex
            KeySchema:
              - AttributeName: usuarioId
                KeyType: HASH
              - AttributeName: creadoEn
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          # Historial del conductor ordenado por fecha
          - IndexName: ConductorFechaIndex
            KeySchema:
              - AttributeName: driverId
                KeyType: HASH
              - AttributeName: creadoEn
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          # Servicios por estado del usuario (para anti-duplicidad)
          - IndexName: UsuarioEstadoIndex
            KeySchema:
              - AttributeName: usuarioId
                KeyType: HASH
              - AttributeName: estado
                KeyType: RANGE
            Projection:
              ProjectionType: KEYS_ONLY

    # ═══════════════════════════════════════════════════════════════════
    # Tabla: conexiones (WebSocket activas)
    # ═══════════════════════════════════════════════════════════════════
    ConexionesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: conexiones
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: connectionId
            AttributeType: S
          - AttributeName: userId
            AttributeType: S
        KeySchema:
          - AttributeName: connectionId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: UserIdIndex
            KeySchema:
              - AttributeName: userId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true

    # ═══════════════════════════════════════════════════════════════════
    # Bucket S3: fotos de perfil (usuarios y conductores)
    # ═══════════════════════════════════════════════════════════════════
    FotosBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: motoramos-fotos-${self:provider.stage}
        CorsConfiguration:
          CorsRules:
            - AllowedHeaders:
                - '*'
              AllowedMethods:
                - PUT
                - GET
              AllowedOrigins:
                - '*'
              MaxAge: 3600
        PublicAccessBlockConfiguration:
          BlockPublicAcls: false
          BlockPublicPolicy: false
          IgnorePublicAcls: false
          RestrictPublicBuckets: false

    FotosBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref FotosBucket
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal: '*'
              Action: s3:GetObject
              Resource: !Sub '${FotosBucket.Arn}/*'

  Outputs:
    UsuariosTableArn:
      Value: !GetAtt UsuariosTable.Arn
    ConductoresTableArn:
      Value: !GetAtt ConductoresTable.Arn
    ServiciosTableArn:
      Value: !GetAtt ServiciosTable.Arn
    ConexionesTableArn:
      Value: !GetAtt ConexionesTable.Arn
    FotosBucketName:
      Value: !Ref FotosBucket
